<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e293b;
        }

        h2 {
            color: #2563eb;
            font-size: 20px;
            margin-top: 30px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 10px;
        }

        th {
            background: #f1f5f9;
            color: #374151;
            text-align: center;
        }

        td:first-child {
            font-weight: bold;
        }

        .upload {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            display: block;
            margin: 30px auto 0;
            padding: 12px 40px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 650px) {
            .row,
            .upload {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>User Registration Form - Updated</h1>

    <form>

        <h2>Personal Details</h2>

        <div class="row">

            <div class="field">
                <label>First Name</label>
                <input type="text" placeholder="Enter first name" required>
            </div>

            <div class="field">
                <label>Last Name</label>
                <input type="text" placeholder="Enter last name" required>
            </div>

        </div>

        <div class="row">

            <div class="field">
                <label>Father Name</label>
                <input type="text" placeholder="Enter father name">
            </div>

            <div class="field">
                <label>Mother Name</label>
                <input type="text" placeholder="Enter mother name">
            </div>

        </div>

        <div class="row">

            <div class="field">
                <label>Email</label>
                <input type="email" placeholder="Enter email" required>
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number">
            </div>

        </div>

        <div class="row">

            <div class="field">
                <label>Date of Birth</label>
                <input type="date">
            </div>

        </div>


        <h2>Education Details</h2>

        <table>

            <tr>
                <th>Qualification</th>
                <th>Institution</th>
                <th>Year</th>
                <th>Percentage / CGPA</th>
            </tr>

            <tr>
                <td>SSC</td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Intermediate</td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Degree</td>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="text"></td>
            </tr>

        </table>


        <h2>Upload Documents</h2>

        <div class="upload">

            <div class="field">
                <label>Upload Photo</label>
                <input type="file" accept="image/*">
            </div>

            <div class="field">
                <label>Upload Signature</label>
                <input type="file" accept="image/*">
            </div>

        </div>


        <button type="submit">Register</button>

    </form>

</div>
    <!-- Updated for Jenkins CI/CD testing -->
</body>
</html>
